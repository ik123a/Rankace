name: Repository checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python scripts/scoring_regression.py

  frontend-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:classes
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
      - run: python ../scripts/package-extension.py --check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure local smoke test
        run: |
          cp .env.example .env
          printf '\nJWT_SECRET=%s\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> .env
      - run: docker compose up --build --wait
      - run: curl --fail --silent http://localhost:8000/health
      - run: curl --fail --silent http://localhost:3000/
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
